<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Knowledge Base Article Builder - clear help articles (offline)</title>
    <meta
      name="description"
      content="Write a how-to, troubleshooting or FAQ article with plain-language checks, and export Markdown or PDF. Runs in your browser; nothing is uploaded."
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="container wide">
      <header class="site">
        <div>
          <h1>Knowledge Base Article Builder</h1>
          <p>Write it once, make it clear, export it anywhere.</p>
        </div>
        <span class="badge">Works offline - nothing leaves this device</span>
      </header>

      <section class="card" aria-labelledby="h-a">
        <h2 id="h-a">1. About the article</h2>
        <div class="grid">
          <div><label for="title">Title</label><input type="text" id="title" maxlength="120" /></div>
          <div>
            <label for="type">Type</label
            ><select id="type"></select>
          </div>
          <div>
            <label for="audience">Audience</label
            ><select id="audience"></select>
          </div>
          <div><label for="product">Product or area</label><input type="text" id="product" maxlength="120" /></div>
          <div><label for="author">Author</label><input type="text" id="author" maxlength="120" /></div>
          <div><label for="updated">Updated on</label><input type="date" id="updated" /></div>
          <div><label for="version">Version</label><input type="text" id="version" maxlength="10" value="1.0" /></div>
          <div><label for="review">Review every (months)</label><input type="number" id="review" min="0" max="60" value="6" /></div>
        </div>
        <label for="summary">One-line summary</label>
        <input type="text" id="summary" maxlength="300" />
      </section>

      <section class="card" aria-labelledby="h-b">
        <h2 id="h-b">2. The content</h2>
        <div class="cols2">
          <div><label for="symptoms">What the reader sees (one per line)</label><textarea id="symptoms" rows="3"></textarea></div>
          <div><label for="cause">Why it happens</label><textarea id="cause" rows="3"></textarea></div>
        </div>
        <label for="steps">Steps, one per line (add a note after a bar: step | note)</label>
        <textarea id="steps" rows="7"></textarea>
        <label for="result">What the reader should see when it has worked (or the answer, for an FAQ)</label>
        <textarea id="result" rows="3"></textarea>
        <div class="cols2">
          <div><label for="related">Related articles (one per line)</label><textarea id="related" rows="2"></textarea></div>
          <div><label for="tags">Tags (comma separated)</label><input type="text" id="tags" /></div>
        </div>
        <div class="row">
          <button id="demo" type="button">Load sample article</button><button id="clear" type="button">Start a new article</button>
        </div>
      </section>

      <section class="card" aria-labelledby="h-c">
        <h2 id="h-c">3. Check and export</h2>
        <p id="read"></p>
        <ul id="problems"></ul>
        <ul class="tips" id="tips"></ul>
        <label for="company">Company name for the PDF (optional)</label>
        <input type="text" id="company" maxlength="80" />
        <div class="row">
          <button class="primary" id="pdf" type="button">Download PDF</button>
          <button id="md" type="button">Download Markdown</button>
          <button id="copy" type="button">Copy Markdown</button>
          <button id="save" type="button">Save (.json)</button>
          <label class="file">Open saved article<input type="file" id="open-file" accept=".json,application/json" /></label>
        </div>
        <p class="status" id="out-status" role="status"></p>
        <h3>Markdown preview</h3>
        <pre class="report" id="preview"></pre>
      </section>

      <footer class="site"><a href="../../index.html">All tools</a> - MIT licensed - <a href="vendor/README.md">pdf-lib</a></footer>
    </main>
    <script src="vendor/pdf-lib.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
